[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weaver-nexus-interoperability-lab"
version = "0.1.0"
description = "Bounded reference harness for advisory AI proposals under static Weaver-style authorization"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]
